name: Publish to Package Managers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (e.g. 2026.8)'
        required: true
        default: '2026.8'
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify-release:
    name: Verify Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _assets
          gh release download "${{ github.event.release.tag_name || inputs.tag_name }}" --dir _assets
          ls -la _assets
          if [ -f "_assets/checksums.sha256" ]; then
            cd _assets
            sha256sum -c checksums.sha256 || true
          fi

  publish-homebrew-tap:
    name: Update Homebrew Tap (OpenUTV/homebrew-utv)
    needs: [verify-release]
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew Cask Formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.BREW_SCOOP_WINGET_TOKEN || secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag_name }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN / BREW_SCOOP_WINGET_TOKEN secret is not set. Skipping Homebrew tap update."
            exit 0
          fi

          VERSION=$(echo "$TAG_NAME" | sed 's/^v//')
          ASSET_NAME="UTV-${VERSION}-macOS-arm64.zip"
          ASSET_URL="https://github.com/OpenUTV/utv/releases/download/${TAG_NAME}/${ASSET_NAME}"

          echo "Downloading $ASSET_URL to compute SHA256..."
          curl -f -L -o "$ASSET_NAME" "$ASSET_URL"
          SHA256=$(sha256sum "$ASSET_NAME" | awk '{print $1}')
          echo "SHA256 for $ASSET_NAME: $SHA256"

          # UTV links Homebrew's Python directly, but nothing else in the cask keeps that exact version installed
          # once pyside and the other formulas move to a newer Python, so `brew autoremove` could delete it.
          # Take the version from the app itself so the cask always matches the release.
          PYTHON_DIR=$(unzip -Z1 "$ASSET_NAME" | grep -oE 'UTV\.app/Contents/lib/python3\.[0-9]+/' | head -n 1 || true)
          PYTHON_FORMULA="python@${PYTHON_DIR#UTV.app/Contents/lib/python}"
          PYTHON_FORMULA="${PYTHON_FORMULA%/}"
          if [ -z "$PYTHON_DIR" ]; then
            echo "::error::Could not find Contents/lib/python3.X in $ASSET_NAME"
            exit 1
          fi
          echo "UTV ${VERSION} uses ${PYTHON_FORMULA}"

          echo "Cloning OpenUTV/homebrew-utv..."
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/OpenUTV/homebrew-utv.git" tap_repo
          cd tap_repo

          mkdir -p Casks
          CASK_FILE="Casks/utv.rb"

          if [ -f "$CASK_FILE" ]; then
            sed -i "s/version \".*\"/version \"${VERSION}\"/" "$CASK_FILE"
            sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" "$CASK_FILE"
            if grep -q 'depends_on formula: "python@' "$CASK_FILE"; then
              sed -i "s/depends_on formula: \"python@[0-9.]*\"/depends_on formula: \"${PYTHON_FORMULA}\"/" "$CASK_FILE"
            else
              sed -i "/depends_on formula: \"pyside\"/a\\  depends_on formula: \"${PYTHON_FORMULA}\"" "$CASK_FILE"
            fi
            grep -q "depends_on formula: \"${PYTHON_FORMULA}\"" "$CASK_FILE" || { echo "::error::Failed to add ${PYTHON_FORMULA} to $CASK_FILE"; exit 1; }
          else
            echo "::error::$CASK_FILE not found in tap repo. Please initialize it first."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CASK_FILE"
          git commit -m "chore(release): bump utv to ${VERSION}" || echo "No changes to commit"
          git push origin main
          echo "Successfully updated OpenUTV/homebrew-utv tap!"
