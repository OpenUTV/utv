name: Publish to Package Managers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (e.g. 2026.8)'
        required: true
        default: '2026.8'
        type: string
      choco_version:
        description: 'Chocolatey package version override (leave empty to use tag version e.g. 2026.8)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify-release:
    name: Verify Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _assets
          gh release download "${{ github.event.release.tag_name || inputs.tag_name }}" --dir _assets
          ls -la _assets
          if [ -f "_assets/checksums.sha256" ]; then
            cd _assets
            sha256sum -c checksums.sha256 || true
          fi

  publish-homebrew-tap:
    name: Update Homebrew Tap (OpenUTV/homebrew-utv)
    needs: [verify-release]
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew Cask Formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.BREW_SCOOP_WINGET_TOKEN || secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag_name }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN / BREW_SCOOP_WINGET_TOKEN secret is not set. Skipping Homebrew tap update."
            exit 0
          fi

          VERSION=$(echo "$TAG_NAME" | sed 's/^v//')
          ASSET_NAME="UTV-${VERSION}-macOS-arm64.zip"
          ASSET_URL="https://github.com/OpenUTV/utv/releases/download/${TAG_NAME}/${ASSET_NAME}"

          echo "Downloading $ASSET_URL to compute SHA256..."
          curl -f -L -o "$ASSET_NAME" "$ASSET_URL"
          SHA256=$(sha256sum "$ASSET_NAME" | awk '{print $1}')
          echo "SHA256 for $ASSET_NAME: $SHA256"

          echo "Cloning OpenUTV/homebrew-utv..."
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/OpenUTV/homebrew-utv.git" tap_repo
          cd tap_repo

          mkdir -p Casks
          CASK_FILE="Casks/utv.rb"

          if [ -f "$CASK_FILE" ]; then
            sed -i "s/version \".*\"/version \"${VERSION}\"/" "$CASK_FILE"
            sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" "$CASK_FILE"
          else
            echo "::error::$CASK_FILE not found in tap repo. Please initialize it first."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CASK_FILE"
          git commit -m "chore(release): bump utv to ${VERSION}" || echo "No changes to commit"
          git push origin main
          echo "Successfully updated OpenUTV/homebrew-utv tap!"

  # Paused: the Scoop, winget and Chocolatey packages are not maintained for now. install.ps1 and the
  # release zip are the supported ways to install on Windows. Remove `if: false` to publish again.
  publish-scoop:
    name: Update Scoop Bucket (OpenUTV/scoop-utv)
    if: false
    needs: [verify-release]
    runs-on: ubuntu-latest
    steps:
      - name: Update Scoop Manifest
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.BREW_SCOOP_WINGET_TOKEN || secrets.SCOOP_BUCKET_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag_name }}
        run: |
          if [ -z "$SCOOP_BUCKET_TOKEN" ]; then
            echo "::warning::SCOOP_BUCKET_TOKEN / BREW_SCOOP_WINGET_TOKEN secret is not set. Skipping Scoop bucket update."
            exit 0
          fi

          VERSION=$(echo "$TAG_NAME" | sed 's/^v//')
          ASSET_NAME="UTV-${VERSION}-windows-x64.zip"
          ASSET_URL="https://github.com/OpenUTV/utv/releases/download/${TAG_NAME}/${ASSET_NAME}"

          curl -f -L -o "$ASSET_NAME" "$ASSET_URL"
          SHA256=$(sha256sum "$ASSET_NAME" | awk '{print $1}')

          git clone "https://x-access-token:${SCOOP_BUCKET_TOKEN}@github.com/OpenUTV/scoop-utv.git" scoop_repo
          cd scoop_repo

          MANIFEST="bucket/utv.json"
          if [ -f "$MANIFEST" ]; then
            jq --arg ver "$VERSION" --arg hash "$SHA256" --arg url "$ASSET_URL" \
              '.version = $ver | .architecture."64bit".hash = $hash | .architecture."64bit".url = $url' \
              "$MANIFEST" > "${MANIFEST}.tmp" && mv "${MANIFEST}.tmp" "$MANIFEST"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$MANIFEST"
            git commit -m "chore(release): bump utv to ${VERSION}" || echo "No changes to commit"
            git push origin HEAD
            echo "Successfully updated Scoop bucket manifest!"
          else
            echo "::warning::$MANIFEST not found in scoop-utv repository. Run scripts/register-scoop.ps1 first."
          fi

  # Paused: the Scoop, winget and Chocolatey packages are not maintained for now. install.ps1 and the
  # release zip are the supported ways to install on Windows. Remove `if: false` to publish again.
  publish-winget:
    name: Submit winget-pkgs PR
    if: false
    needs: [verify-release]
    runs-on: ubuntu-latest
    steps:
      - name: Create branch in OpenUTV/winget-pkgs and submit PR to microsoft/winget-pkgs
        env:
          WINGET_PAT: ${{ secrets.BREW_SCOOP_WINGET_TOKEN || secrets.WINGET_PAT }}
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag_name }}
        run: |
          if [ -z "$WINGET_PAT" ]; then
            echo "::warning::WINGET_PAT / BREW_SCOOP_WINGET_TOKEN secret is not set. Skipping winget release."
            exit 0
          fi

          VERSION=$(echo "$TAG_NAME" | sed 's/^v//')
          ASSET_NAME="UTV-${VERSION}-windows-x64.zip"
          ASSET_URL="https://github.com/OpenUTV/utv/releases/download/${TAG_NAME}/${ASSET_NAME}"

          echo "Downloading $ASSET_URL to compute SHA256..."
          curl -f -L -o "$ASSET_NAME" "$ASSET_URL"
          SHA256_LOWER=$(sha256sum "$ASSET_NAME" | awk '{print $1}')
          SHA256_UPPER=$(echo "$SHA256_LOWER" | tr '[:lower:]' '[:upper:]')
          echo "SHA256 for $ASSET_NAME: $SHA256_UPPER"

          echo "Cloning OpenUTV/winget-pkgs fork..."
          git clone "https://x-access-token:${WINGET_PAT}@github.com/OpenUTV/winget-pkgs.git" winget_repo
          cd winget_repo

          git remote add upstream https://github.com/microsoft/winget-pkgs.git
          git fetch upstream master

          BRANCH="openutv-app-${VERSION}"
          echo "Checking out branch $BRANCH from upstream master..."
          git checkout -B "$BRANCH" upstream/master

          MANIFEST_DIR="manifests/o/OpenUTV/UTV/${VERSION}"
          mkdir -p "$MANIFEST_DIR"

          sed 's/^          //' <<EOF > "$MANIFEST_DIR/OpenUTV.UTV.yaml"
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.version.1.12.0.schema.json

          PackageIdentifier: OpenUTV.UTV
          PackageVersion: "${VERSION}"
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.12.0
          EOF

          sed 's/^          //' <<EOF > "$MANIFEST_DIR/OpenUTV.UTV.locale.en-US.yaml"
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.defaultLocale.1.12.0.schema.json

          PackageIdentifier: OpenUTV.UTV
          PackageVersion: "${VERSION}"
          PackageLocale: en-US
          Publisher: OpenUTV
          PublisherUrl: https://github.com/OpenUTV
          PublisherSupportUrl: https://github.com/OpenUTV/utv/issues
          PackageName: OpenUTV
          PackageUrl: https://github.com/OpenUTV/utv
          License: Apache-2.0
          LicenseUrl: https://github.com/OpenUTV/utv/blob/main/LICENSE
          ShortDescription: High-performance framecycler and sequence viewer for VFX, animation, and digital media
          Description: OpenUTV is a high-performance, open-source framecycler and sequence viewer designed for VFX, animation, editorial, and digital media review workflows.
          Tags:
          - media-player
          - sequence-viewer
          - vfx
          - rv
          - video
          - framecycler
          ManifestType: defaultLocale
          ManifestVersion: 1.12.0
          EOF

          sed 's/^          //' <<EOF > "$MANIFEST_DIR/OpenUTV.UTV.installer.yaml"
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json

          PackageIdentifier: OpenUTV.UTV
          PackageVersion: "${VERSION}"
          InstallerLocale: en-US
          InstallerType: zip
          NestedInstallerType: portable
          Installers:
          - Architecture: x64
            InstallerUrl: ${ASSET_URL}
            InstallerSha256: ${SHA256_UPPER}
            NestedInstallerFiles:
            - RelativeFilePath: utv-windows-x64\\bin\\utv.exe
              PortableCommandAlias: utv
          Dependencies:
            PackageDependencies:
            - PackageIdentifier: OpenUTV.OpenUTVDeps
              MinimumVersion: "26.5"
          ManifestType: installer
          ManifestVersion: 1.12.0
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST_DIR"
          git commit -m "New package: OpenUTV.UTV version ${VERSION}" || echo "No changes to commit"
          git push -u origin "$BRANCH" --force

          echo "Submitting PR to microsoft/winget-pkgs..."
          export GH_TOKEN="${WINGET_PAT}"
          
          EXISTING_PR=$(gh pr list --repo microsoft/winget-pkgs --head "OpenUTV:${BRANCH}" --state open --json number -q '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #${EXISTING_PR} already exists for branch ${BRANCH}."
          else
            PR_BODY=$(printf "## Description\n\nNew package submission for OpenUTV.UTV version %s.\n\nOpenUTV is a high-performance, open-source framecycler and sequence viewer designed for VFX, animation, editorial, and digital media review workflows.\n\n## Checklist\n- [x] Signed the Contributor License Agreement\n- [x] Checked that there aren't other open pull requests for this package version\n- [x] Manifest conforms to the 1.12 schema\n" "${VERSION}")

            gh pr create --repo microsoft/winget-pkgs \
              --head "OpenUTV:${BRANCH}" \
              --base master \
              --title "New package: OpenUTV.UTV version ${VERSION}" \
              --body "$PR_BODY"
          fi
          echo "Winget package submission completed!"

  # Paused: the Scoop, winget and Chocolatey packages are not maintained for now. install.ps1 and the
  # release zip are the supported ways to install on Windows. Remove `if: false` to publish again.
  publish-chocolatey:
    name: Push to Chocolatey
    if: false
    needs: [verify-release]
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Pack and Push to Chocolatey Community Repository
        shell: powershell
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag_name }}
        run: |
          if (-not $env:CHOCO_API_KEY) {
            Write-Warning "CHOCO_API_KEY secret is not set. Skipping Chocolatey push."
            exit 0
          }

          $Version = $env:TAG_NAME.TrimStart("v")
          $ChocoVersion = if ("${{ inputs.choco_version }}") { "${{ inputs.choco_version }}" } else { $Version }
          $Url = "https://github.com/OpenUTV/utv/releases/download/$($env:TAG_NAME)/UTV-$Version-windows-x64.zip"

          $tempZip = Join-Path $env:TEMP "choco-dl.zip"
          Invoke-WebRequest -Uri $Url -OutFile $tempZip -UseBasicParsing
          $sha256 = (Get-FileHash -Path $tempZip -Algorithm SHA256).Hash.ToLower()

          # Update nuspec version
          (Get-Content chocolatey\openutv\openutv.nuspec) -replace '<version>.*?</version>', "<version>$ChocoVersion</version>" | Set-Content chocolatey\openutv\openutv.nuspec

          # Update install script
          (Get-Content chocolatey\openutv\tools\chocolateyInstall.ps1) `
            -replace 'url64\s*=\s*''.*?''', "url64         = '$Url'" `
            -replace 'checksum64\s*=\s*''.*?''', "checksum64    = '$sha256'" | Set-Content chocolatey\openutv\tools\chocolateyInstall.ps1

          # 1. Pack and push openutv-dependencies if updated
          Write-Host "Packing openutv-dependencies..."
          choco pack chocolatey\openutv-dependencies\openutv-dependencies.nuspec --outputdirectory chocolatey\openutv-dependencies
          $depsNupkg = (Get-ChildItem chocolatey\openutv-dependencies\*.nupkg | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          Write-Host "Attempting push of $depsNupkg to Chocolatey..."
          try {
            choco push $depsNupkg --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
            Write-Host "Pushed openutv-dependencies to Chocolatey."
          } catch {
            Write-Warning "openutv-dependencies push note: $_"
          }

          # 2. Pack and push openutv
          Write-Host "Packing openutv ($ChocoVersion)..."
          choco pack chocolatey\openutv\openutv.nuspec --outputdirectory chocolatey\openutv
          $nupkg = (Get-ChildItem chocolatey\openutv\*.nupkg | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          Write-Host "Pushing $nupkg to Chocolatey..."
          choco push $nupkg --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
