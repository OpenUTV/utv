name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  semantic-pr-title:
    name: Validate PR Title
    if: github.repository_owner == 'OpenUTV'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            build
            ci
            test
            chore
            style
            refactor

  commit-lint:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install and Run Commitlint
        run: |
          npm install --no-save @commitlint/cli @commitlint/config-conventional
          npx commitlint --from ${{ github.event.pull_request.base.sha }} \
                         --to ${{ github.event.pull_request.head.sha }} \
                         --verbose

  lint:
    name: Lint Codebase (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  check-build:
    name: Build Smoke Check
    # Only run on repos within OpenUTV org (not external forks without secrets)
    if: github.repository_owner == 'OpenUTV'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Detect Code Changes
        id: filter
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | grep -E '^(src/|cmake/|build\.sh|CMakeLists\.txt|\.github/actions/)' || true)
          if [ -n "$CHANGED" ]; then
            echo "code_changed=true" >> $GITHUB_OUTPUT
            echo "Code changes detected."
          else
            echo "code_changed=false" >> $GITHUB_OUTPUT
            echo "No code changes detected."
          fi

      - name: Test Build Script Syntax
        if: steps.filter.outputs.code_changed == 'true'
        run: |
          bash -n ./build.sh
          echo "build.sh syntax validation passed."

  docs-check:
    name: Typst Manuals Check
    runs-on: ubuntu-24.04
    env:
      TYPST_VERSION: "0.15.1"
      PANDOC_VERSION: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Docs Changes
        id: filter
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | grep -E '^docs/(rv-manuals|images|images-web)/' || true)
          if [ -n "$CHANGED" ]; then
            echo "docs_changed=true" >> $GITHUB_OUTPUT
          else
            echo "docs_changed=false" >> $GITHUB_OUTPUT
            echo "No changes to the Typst manuals."
          fi

      - name: Setup Python
        if: steps.filter.outputs.docs_changed == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Typst, Pandoc and Sphinx
        if: steps.filter.outputs.docs_changed == 'true'
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ --strip-components=1 -C "$HOME/bin" typst-x86_64-unknown-linux-musl/typst
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz" \
            | tar -xz --strip-components=2 -C "$HOME/bin" "pandoc-${PANDOC_VERSION}/bin/pandoc"
          echo "$HOME/bin" >> $GITHUB_PATH
          pip install -r docs/rv-manuals/rtd/requirements.txt

      - name: Build every chapter (Typst PDF + HTML, Read the Docs)
        if: steps.filter.outputs.docs_changed == 'true'
        run: docs/rv-manuals/build-docs.sh --check
