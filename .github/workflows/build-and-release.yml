name: Build and Release macOS

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint codebase
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          
      - name: Install pre-commit
        run: pip install pre-commit
        
      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  build:
    name: Build macOS
    needs: lint
    runs-on: macos-26 # arm64
    outputs:
      version: ${{ steps.versioning.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0 # Need all history and tags to determine version

      - name: Determine Next Semantic Version
        id: versioning
        run: |
          YEAR=$(date +%Y)
          LATEST_TAG=$(git tag -l "${YEAR}.*" | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="${YEAR}.1"
          else
            MINOR=$(echo $LATEST_TAG | cut -d'.' -f2)
            NEW_VERSION="${YEAR}.$((MINOR + 1))"
          fi
          
          # If it's a pull request, append PR number
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            NEW_VERSION="${NEW_VERSION}-PR${{ github.event.pull_request.number }}"
          elif [ "${{ github.event_name }}" == "push" ]; then
            NEW_VERSION="${NEW_VERSION}-dev"
          fi
          
          echo "Next version is: $NEW_VERSION"
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Get current date
        id: date
        run: echo "date=$(date +%Y-%W)" >> $GITHUB_OUTPUT # Updates weekly
        shell: bash

      - name: Cache Homebrew
        uses: actions/cache@v6
        with:
          save-always: true
          path: |
            ~/Library/Caches/Homebrew/downloads
            ~/Library/Caches/Homebrew/Casks
          # Re-evaluate the cache weekly to capture upstream brew updates
          key: ${{ runner.os }}-brew-${{ steps.date.outputs.date }}-${{ hashFiles('**/build.sh') }}
          restore-keys: |
            ${{ runner.os }}-brew-${{ steps.date.outputs.date }}-
            ${{ runner.os }}-brew-

      - name: Install Homebrew dependencies
        run: |
          brew install --formula \
               ninja readline sqlite3 xz zlib tcl-tk@8 python-tk autoconf automake libtool python@3.14 yasm clang-format black meson nasm pkg-config glew ccache doctest qt \
               ffmpeg openexr imath opencolorio libraw libtiff libpng boost openimageio openjpeg webp yaml-cpp spdlog icu4c openjph jpeg-turbo
        shell: bash



      - name: Cache CCache
        uses: actions/cache@v6
        with:
          save-always: true
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Build UTV (macOS)
        run: |
          export CCACHE_DIR=~/.ccache
          export SDKROOT=$(xcrun --show-sdk-path)
          chmod +x ./build.sh
          # Only pass major.minor (strip -PR stuff for CMake)
          CLEAN_VERSION=$(echo "${{ steps.versioning.outputs.version }}" | cut -d'-' -f1)
          ./build.sh --release --clean --version $CLEAN_VERSION
        shell: bash

      - name: Archive Unsigned App
        run: |
          mkdir -p _build/stage/unsigned
          tar -czf _build/stage/unsigned/UTV.app.tar.gz -C _build/stage/app UTV.app
        shell: bash

      - name: Upload Unsigned App Artifact
        uses: actions/upload-artifact@v7
        with:
          name: utv-app-unsigned-${{ steps.versioning.outputs.version }}
          path: _build/stage/unsigned/UTV.app.tar.gz
          retention-days: 1

  sign-and-notarize:
    name: Sign & Notarize macOS
    needs: build
    runs-on: macos-26 # arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download Unsigned App Artifact
        uses: actions/download-artifact@v8
        with:
          name: utv-app-unsigned-${{ needs.build.outputs.version }}
          path: _build/stage/unsigned

      - name: Extract Unsigned App
        run: |
          mkdir -p _build/stage/app
          ARCHIVE=$(find _build/stage/unsigned -name "UTV.app.tar.gz" | head -n 1)
          if [ -z "$ARCHIVE" ]; then
            echo "::error::Could not find UTV.app.tar.gz in _build/stage/unsigned"
            ls -laR _build/stage/unsigned
            exit 1
          fi
          echo "Extracting $ARCHIVE into _build/stage/app..."
          tar -xzf "$ARCHIVE" -C _build/stage/app
        shell: bash

      - name: Sign & Notarize macOS App
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          ENTITLEMENTS="${PWD}/src/bin/nsapps/UTV/entitlements.plist"
          APP_PATH="_build/stage/app/UTV.app"
          ZIP_NAME="UTV-${{ needs.build.outputs.version }}-macOS-arm64.zip"

          if [ -n "${MACOS_CERTIFICATE}" ] && [ -n "${MACOS_CERTIFICATE_PWD}" ]; then
            echo "--- Importing Developer ID Certificate ---"
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
            KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            CERT_PATH=$RUNNER_TEMP/certificate.p12
            echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
            security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed -e 's/^[[:space:]]*//' | tr -d '"')

            # Determine Signing Identity
            SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -n 1 | awk -F'"' '{print $2}')
            if [ -z "$SIGNING_IDENTITY" ]; then
              SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -n 1 | awk -F'"' '{print $2}')
            fi
            echo "Using Signing Identity: $SIGNING_IDENTITY"

            MAIN_EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Contents/Info.plist" 2>/dev/null || echo "UTV")

            echo "--- Normalizing Info.plist metadata ---"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.OpenUTV.UTV" "$APP_PATH/Contents/Info.plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :LSMinimumSystemVersion 11.0.0" "$APP_PATH/Contents/Info.plist" 2>/dev/null || true

            echo "--- Stripping pre-existing linker signatures ---"
            codesign --remove-signature "$APP_PATH/Contents/MacOS/$MAIN_EXE" 2>/dev/null || true

            echo "--- Removing legacy symlinks and empty directories from bundle ---"
            find "$APP_PATH/Contents/MacOS" -type l -delete
            rmdir "$APP_PATH/Contents/include" 2>/dev/null || true
            rmdir "$APP_PATH/Contents/src" 2>/dev/null || true

            echo "--- Signing nested components inside-out with Hardened Runtime ---"
            if [ -d "$APP_PATH/Contents/Helpers" ]; then
              find "$APP_PATH/Contents/Helpers" -maxdepth 1 -name "*.app" -type d 2>/dev/null | while read -r helper; do
                echo "Signing helper app: $helper"
                find "$helper/Contents/MacOS" -type f -exec codesign --force --options runtime --timestamp --entitlements "$ENTITLEMENTS" --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" {} +
                codesign --force --options runtime --timestamp --entitlements "$ENTITLEMENTS" --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" "$helper"
              done
            fi

            if [ -d "$APP_PATH/Contents/Frameworks" ]; then
              echo "Signing frameworks"
              find "$APP_PATH/Contents/Frameworks" -type d -name "*.framework" -exec codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" {} +
            fi

            echo "Signing dynamic libraries and Python extensions"
            find "$APP_PATH/Contents" -type f \( -name "*.dylib" -o -name "*.so" \) -exec codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" {} +

            echo "Signing PlugIns subcomponents"
            find "$APP_PATH/Contents/PlugIns" -type f ! -name "*.dylib" ! -name "*.so" -exec codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" {} +

            echo "Signing auxiliary executables in Contents/MacOS"
            find "$APP_PATH/Contents/MacOS" -type f ! -name "$MAIN_EXE" ! -name "*.plist" -exec codesign --force --options runtime --timestamp --entitlements "$ENTITLEMENTS" --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" {} +

            echo "Signing outer bundle UTV.app"
            codesign --force --options runtime --timestamp --entitlements "$ENTITLEMENTS" --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" "$APP_PATH"

            echo "--- Verifying signature ---"
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
            codesign -dvvv "$APP_PATH/Contents/MacOS/$MAIN_EXE"
            codesign -dvvv "$APP_PATH"

            cd _build/stage/app
            /usr/bin/ditto -c -k --keepParent UTV.app "$ZIP_NAME"

            if [ -n "${APPLE_API_KEY_ID}" ] && [ -n "${APPLE_API_ISSUER}" ] && [ -n "${APPLE_API_KEY}" ]; then
              echo "--- Submitting to Apple Notary Service ---"
              KEY_FILE=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8
              echo "$APPLE_API_KEY" | base64 --decode > "$KEY_FILE"

              set +e
              SUBMIT_OUTPUT=$(xcrun notarytool submit "$ZIP_NAME" \
                --key "$KEY_FILE" \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER" \
                --wait 2>&1)
              SUBMIT_EXIT=$?
              set -e

              echo "$SUBMIT_OUTPUT"

              SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep -E "id: [0-9a-f-]+" | head -n 1 | awk '{print $2}')
              if [ -n "$SUBMISSION_ID" ]; then
                echo "Submission ID: $SUBMISSION_ID"
              fi

              if [ $SUBMIT_EXIT -ne 0 ] || echo "$SUBMIT_OUTPUT" | grep -q -i "status: Invalid"; then
                echo "::error::Notarization failed!"
                if [ -n "$SUBMISSION_ID" ]; then
                  echo "--- Fetching Notarization Log ---"
                  xcrun notarytool log "$SUBMISSION_ID" \
                    --key "$KEY_FILE" \
                    --key-id "$APPLE_API_KEY_ID" \
                    --issuer "$APPLE_API_ISSUER" || true
                fi
                exit 1
              fi

              echo "--- Stapling Notarization Ticket ---"
              xcrun stapler staple UTV.app
              xcrun stapler validate UTV.app
              rm -f "$ZIP_NAME"
              /usr/bin/ditto -c -k --keepParent UTV.app "$ZIP_NAME"
            else
              echo "Apple Notary API credentials not configured; skipping notarization submission."
            fi
          else
            echo "No Developer ID certificate configured. Applying Ad-Hoc code signature."
            codesign --force --deep --sign - "$APP_PATH"
            cd _build/stage/app
            /usr/bin/ditto -c -k --keepParent UTV.app "$ZIP_NAME"
          fi
        shell: bash

      - name: Upload Signed Artifact
        uses: actions/upload-artifact@v7
        with:
          name: UTV-${{ needs.build.outputs.version }}-macOS-arm64
          path: _build/stage/app/UTV-${{ needs.build.outputs.version }}-macOS-arm64.zip
          retention-days: 7

  release:
    name: Release
    needs: [build, sign-and-notarize]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: UTV-${{ needs.build.outputs.version }}-macOS-arm64
          path: _build/stage/app

      - name: Generate Release Notes
        id: release-notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Cask Formula
        run: |
          ZIP_FILE=$(find _build/stage/app -name "UTV-${{ needs.build.outputs.version }}-macOS-arm64.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Could not find UTV-${{ needs.build.outputs.version }}-macOS-arm64.zip in _build/stage/app"
            ls -laR _build/stage/app
            exit 1
          fi
          if [ "$ZIP_FILE" != "_build/stage/app/UTV-${{ needs.build.outputs.version }}-macOS-arm64.zip" ]; then
            cp "$ZIP_FILE" "_build/stage/app/UTV-${{ needs.build.outputs.version }}-macOS-arm64.zip"
            ZIP_FILE="_build/stage/app/UTV-${{ needs.build.outputs.version }}-macOS-arm64.zip"
          fi
          SHA256_HASH=$(sha256sum "$ZIP_FILE" | awk '{print $1}')
          
          # Update version and sha256 in Cask formula
          sed -i "s/version \".*\"/version \"${{ needs.build.outputs.version }}\"/" Casks/utv.rb
          sed -i "s/sha256 \".*\"/sha256 \"$SHA256_HASH\"/" Casks/utv.rb
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/utv.rb
          git commit -m "chore(release): update homebrew cask for ${{ needs.build.outputs.version }} [skip ci]" || echo "No changes to commit"
          git push origin main
        shell: bash

      - name: Create and Push Tag
        run: |
          git tag ${{ needs.build.outputs.version }}
          git push origin ${{ needs.build.outputs.version }}
        shell: bash

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: UTV Release ${{ needs.build.outputs.version }}
          body: ${{ steps.release-notes.outputs.content }}
          files: _build/stage/app/UTV-${{ needs.build.outputs.version }}-macOS-arm64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
