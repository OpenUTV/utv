name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version to build (e.g. 2026.8). Leave blank for next version.'
        required: false
        default: ''
        type: string
      create_release:
        description: 'Publish GitHub Release and push Git tag? (Leave unchecked for test build)'
        required: false
        default: false
        type: boolean
      platforms:
        description: 'Platform targets to build'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'macos-only'
          - 'windows-only'
          - 'linux-only'

permissions:
  contents: write
  pull-requests: read
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 1. Lint Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  version:
    name: 2. Determine Version
    needs: [lint]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versioning.outputs.version }}
      clean_version: ${{ steps.versioning.outputs.clean_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Next Semantic Version
        id: versioning
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then
            NEW_VERSION="${{ inputs.version_override }}"
          else
            YEAR=$(date +%Y)
            LATEST_TAG=$(git tag -l "${YEAR}.*" | sort -V | tail -n 1)
            if [ -z "$LATEST_TAG" ]; then
              NEW_VERSION="${YEAR}.1"
            else
              MINOR=$(echo $LATEST_TAG | cut -d'.' -f2)
              NEW_VERSION="${YEAR}.$((MINOR + 1))"
            fi
            
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              NEW_VERSION="${NEW_VERSION}-PR${{ github.event.pull_request.number }}"
            fi
          fi
          
          CLEAN_VERSION=$(echo "$NEW_VERSION" | cut -d'-' -f1)
          echo "Next version is: $NEW_VERSION (clean: $CLEAN_VERSION)"
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "clean_version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT

  build-macos:
    name: 3a. Build macOS
    needs: [version]
    if: inputs.platforms == 'all' || inputs.platforms == 'macos-only'
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check out proprietary vendor SDKs
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: OpenUTV/openutv-vendor-sdks
          token: ${{ secrets.GH_TOKEN_DEPS_READ }}
          path: openutv-vendor-sdks

      - name: Get current date
        id: date
        run: echo "date=$(date +%Y-%W)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Restore Homebrew cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/Library/Caches/Homebrew/downloads
            ~/Library/Caches/Homebrew/Casks
          key: ${{ runner.os }}-brew-${{ steps.date.outputs.date }}-${{ hashFiles('**/build.sh') }}
          restore-keys: |
            ${{ runner.os }}-brew-${{ steps.date.outputs.date }}-
            ${{ runner.os }}-brew-

      - name: Install Homebrew dependencies
        run: |
          brew install --formula \
               ninja readline sqlite3 xz zlib tcl-tk@8 python-tk autoconf automake libtool python@3.14 yasm clang-format black meson nasm pkg-config glew ccache doctest qt pyside \
               ffmpeg openexr imath opencolorio libraw libtiff libpng libspng boost openimageio openjpeg webp yaml-cpp spdlog icu4c openjph jpeg-turbo
        shell: bash

      - name: Save Homebrew cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/Library/Caches/Homebrew/downloads
            ~/Library/Caches/Homebrew/Casks
          key: ${{ runner.os }}-brew-${{ steps.date.outputs.date }}-${{ hashFiles('**/build.sh') }}

      - name: Restore CCache
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Build UTV (macOS)
        run: |
          export CCACHE_DIR=~/.ccache
          export SDKROOT=$(xcrun --show-sdk-path)
          chmod +x ./build.sh
          ./build.sh --release --clean --version "${{ needs.version.outputs.clean_version }}"
        shell: bash

      - name: Save CCache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}

      - name: Archive Unsigned App
        run: |
          export COPYFILE_DISABLE=1
          find _build/stage/app/UTV.app -name "._*" -delete
          mkdir -p _build/stage/unsigned
          tar -czf _build/stage/unsigned/UTV.app.tar.gz -C _build/stage/app UTV.app
        shell: bash

      - name: Upload Unsigned App Artifact
        uses: actions/upload-artifact@v7
        with:
          name: utv-app-unsigned-${{ needs.version.outputs.version }}
          path: _build/stage/unsigned/UTV.app.tar.gz
          retention-days: 1

  sign-macos:
    name: 4a. Sign & Notarize macOS
    needs: [version, build-macos]
    if: inputs.platforms == 'all' || inputs.platforms == 'macos-only'
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download Unsigned App Artifact
        uses: actions/download-artifact@v8
        with:
          name: utv-app-unsigned-${{ needs.version.outputs.version }}
          path: _build/stage/unsigned

      - name: Extract Unsigned App
        run: |
          export COPYFILE_DISABLE=1
          mkdir -p _build/stage/app
          ARCHIVE=$(find _build/stage/unsigned -name "UTV.app.tar.gz" | head -n 1)
          if [ -z "$ARCHIVE" ]; then
            echo "::error::Could not find UTV.app.tar.gz in _build/stage/unsigned"
            exit 1
          fi
          echo "Extracting $ARCHIVE into _build/stage/app..."
          tar -xzf "$ARCHIVE" -C _build/stage/app
          find _build/stage/app/UTV.app -name "._*" -delete
        shell: bash

      - name: Sign & Notarize macOS App
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          ENTITLEMENTS="${PWD}/src/bin/nsapps/UTV/entitlements.plist"
          APP_PATH="_build/stage/app/UTV.app"
          ZIP_NAME="UTV-${{ needs.version.outputs.version }}-macOS-arm64.zip"

          if [ -n "${MACOS_CERTIFICATE}" ] && [ -n "${MACOS_CERTIFICATE_PWD}" ]; then
            echo "--- Importing Developer ID Certificate ---"
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
            KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            CERT_PATH=$RUNNER_TEMP/certificate.p12
            echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
            security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed -e 's/^[[:space:]]*//' | tr -d '"')

            SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -n 1 | awk -F'"' '{print $2}')
            if [ -z "$SIGNING_IDENTITY" ]; then
              SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -n 1 | awk -F'"' '{print $2}')
            fi
            echo "Using Signing Identity: $SIGNING_IDENTITY"

            MAIN_EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Contents/Info.plist" 2>/dev/null || echo "UTV")

            echo "--- Normalizing Info.plist metadata ---"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.OpenUTV.UTV" "$APP_PATH/Contents/Info.plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :LSMinimumSystemVersion 11.0.0" "$APP_PATH/Contents/Info.plist" 2>/dev/null || true

            echo "--- Stripping pre-existing linker signatures ---"
            codesign --remove-signature "$APP_PATH/Contents/MacOS/$MAIN_EXE" 2>/dev/null || true

            echo "--- Removing legacy symlinks, AppleDouble files, and empty directories from bundle ---"
            find "$APP_PATH/Contents/MacOS" -type l -delete
            find "$APP_PATH" -name "._*" -delete
            find "$APP_PATH/Contents/lib" -type d -name "bin" -exec rm -rf {} + 2>/dev/null || true
            rmdir "$APP_PATH/Contents/include" 2>/dev/null || true
            rmdir "$APP_PATH/Contents/src" 2>/dev/null || true

            echo "--- Sanitizing Homebrew dynamic library links ---"
            python3 "${PWD}/src/build/sanitize_homebrew_links.py" "$APP_PATH"

            echo "--- Signing nested components inside-out with Hardened Runtime ---"
            if [ -d "$APP_PATH/Contents/Helpers" ]; then
              find "$APP_PATH/Contents/Helpers" -maxdepth 1 -name "*.app" -type d 2>/dev/null | while read -r helper; do
                echo "Signing helper app: $helper"
                find "$helper/Contents/MacOS" -type f -exec codesign --force --options runtime --timestamp --entitlements "$ENTITLEMENTS" --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" {} +
                codesign --force --options runtime --timestamp --entitlements "$ENTITLEMENTS" --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" "$helper"
              done
            fi

            if [ -d "$APP_PATH/Contents/Frameworks" ]; then
              echo "Signing frameworks"
              find "$APP_PATH/Contents/Frameworks" -type d -name "*.framework" -exec codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" {} +
            fi

            echo "Signing dynamic libraries and Python extensions"
            find "$APP_PATH/Contents" -type f \( -name "*.dylib" -o -name "*.so" \) -exec codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" {} +

            echo "Signing PlugIns subcomponents"
            find "$APP_PATH/Contents/PlugIns" -type f ! -name "*.dylib" ! -name "*.so" -exec codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" {} +

            echo "Signing any remaining Mach-O binaries in bundle (excluding Contents/MacOS)"
            find "$APP_PATH/Contents" -path "$APP_PATH/Contents/MacOS" -prune -o -type f ! -name "*.plist" -print | while read -r file; do
              if [ -f "$file" ] && file -b "$file" | grep -q "Mach-O"; then
                echo "Signing Mach-O: $file"
                codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" "$file"
              fi
            done

            echo "Signing executables in Contents/MacOS with entitlements"
            find "$APP_PATH/Contents/MacOS" -type f ! -name "*.plist" -exec codesign --force --options runtime --timestamp --entitlements "$ENTITLEMENTS" --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" {} +

            echo "Signing outer bundle UTV.app"
            codesign --force --options runtime --timestamp --entitlements "$ENTITLEMENTS" --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" "$APP_PATH"

            echo "--- Verifying signature & entitlements ---"
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
            codesign -dvvv "$APP_PATH/Contents/MacOS/$MAIN_EXE"
            codesign -dvvv "$APP_PATH"

            export COPYFILE_DISABLE=1
            find "$APP_PATH" -name "._*" -delete
            cd _build/stage/app
            /usr/bin/ditto -c -k --keepParent UTV.app "$ZIP_NAME"

            if [ -n "${APPLE_API_KEY_ID}" ] && [ -n "${APPLE_API_ISSUER}" ] && [ -n "${APPLE_API_KEY}" ]; then
              echo "--- Submitting to Apple Notary Service ---"
              KEY_FILE=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8
              echo "$APPLE_API_KEY" | base64 --decode > "$KEY_FILE"

              set +e
              SUBMIT_OUTPUT=$(xcrun notarytool submit "$ZIP_NAME" \
                --key "$KEY_FILE" \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER" \
                --wait 2>&1)
              SUBMIT_EXIT=$?
              set -e

              echo "$SUBMIT_OUTPUT"
              SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep -E "id: [0-9a-f-]+" | head -n 1 | awk '{print $2}')
              if [ -n "$SUBMISSION_ID" ]; then
                echo "Submission ID: $SUBMISSION_ID"
              fi

              if [ $SUBMIT_EXIT -ne 0 ] || echo "$SUBMIT_OUTPUT" | grep -q -i "status: Invalid"; then
                echo "::error::Notarization failed!"
                if [ -n "$SUBMISSION_ID" ]; then
                  xcrun notarytool log "$SUBMISSION_ID" \
                    --key "$KEY_FILE" \
                    --key-id "$APPLE_API_KEY_ID" \
                    --issuer "$APPLE_API_ISSUER" || true
                fi
                exit 1
              fi

              echo "--- Stapling Notarization Ticket ---"
              xcrun stapler staple UTV.app
              xcrun stapler validate UTV.app
              rm -f "$ZIP_NAME"
              /usr/bin/ditto -c -k --keepParent UTV.app "$ZIP_NAME"
            else
              echo "Apple Notary API credentials not configured; skipping notarization submission."
            fi
          else
            echo "No Developer ID certificate configured. Applying Ad-Hoc code signature."
            codesign --force --deep --sign - "$APP_PATH"
            cd _build/stage/app
            /usr/bin/ditto -c -k --keepParent UTV.app "$ZIP_NAME"
          fi
        shell: bash

      - name: Upload Signed Artifact
        uses: actions/upload-artifact@v7
        with:
          name: UTV-${{ needs.version.outputs.version }}-macOS-arm64
          path: _build/stage/app/UTV-${{ needs.version.outputs.version }}-macOS-arm64.zip
          retention-days: 7

      - name: Clean up Keychain and Secrets
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey_"*.p8 2>/dev/null || true
        shell: bash

  build-windows:
    name: 3b. Build Windows
    needs: [version]
    if: inputs.platforms == 'all' || inputs.platforms == 'windows-only'
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check out proprietary vendor SDKs
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: OpenUTV/openutv-vendor-sdks
          token: ${{ secrets.GH_TOKEN_DEPS_READ }}
          path: openutv-vendor-sdks

      - name: Build Windows Executable and Packages
        uses: ./.github/actions/build-windows
        with:
          version: ${{ needs.version.outputs.clean_version }}

      - name: Package Windows Distribution Archive
        shell: powershell
        run: |
          $Ver = "${{ needs.version.outputs.version }}"
          $ZipName = "UTV-$Ver-windows-x64.zip"
          Write-Host "Packaging _install into $ZipName..."
          New-Item -ItemType Directory -Force -Path "_dist" | Out-Null
          Rename-Item -Path "_install" -NewName "utv-windows-x64"
          Compress-Archive -Path "utv-windows-x64" -DestinationPath "_dist\$ZipName" -CompressionLevel Optimal
          Write-Host "Created _dist\$ZipName successfully."

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: UTV-${{ needs.version.outputs.version }}-windows-x64
          path: _dist/UTV-${{ needs.version.outputs.version }}-windows-x64.zip
          retention-days: 7

  sign-windows:
    name: 4b. Sign Windows (Authenticode Stub)
    needs: [version, build-windows]
    if: inputs.platforms == 'all' || inputs.platforms == 'windows-only'
    runs-on: windows-2022
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v8
        with:
          name: UTV-${{ needs.version.outputs.version }}-windows-x64
          path: _dist

      - name: Authenticode Signing Check
        shell: powershell
        run: |
          Write-Host "Windows Code Signing Stub: Pass-through mode."
          Write-Host "When an Azure Trusted Signing or EV Authenticode certificate is provisioned,"
          Write-Host "this job will unpack, sign utv.exe and DLLs with signtool.exe, and repackage."
          Get-ChildItem _dist

  build-linux-ubuntu:
    name: 3c. Build Linux (Ubuntu 24.04)
    needs: [version]
    if: inputs.platforms == 'all' || inputs.platforms == 'linux-only'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Build Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential python3 python3-pip libgl1-mesa-dev libglu1-mesa-dev
        shell: bash

      - name: Build UTV Linux (Experimental)
        run: |
          chmod +x ./build.sh
          ./build.sh --install-deps --release --clean --version "${{ needs.version.outputs.clean_version }}"
        shell: bash

      - name: Package Linux Distribution Tarball
        if: success()
        run: |
          mkdir -p _dist
          if [ -d "_build/stage/app" ]; then
            tar -czf "_dist/UTV-${{ needs.version.outputs.version }}-linux-x64.tar.gz" -C _build/stage/app .
          fi
        shell: bash

      - name: Upload Linux Artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: UTV-${{ needs.version.outputs.version }}-linux-x64
          path: _dist/UTV-${{ needs.version.outputs.version }}-linux-x64.tar.gz
          retention-days: 7

  build-linux-rhel:
    name: 3d. Build Linux (Enterprise / Rocky 9)
    needs: [version]
    if: inputs.platforms == 'all' || inputs.platforms == 'linux-only'
    runs-on: ubuntu-latest
    container: rockylinux:9
    continue-on-error: true
    steps:
      - name: Install Core Packages
        run: |
          dnf install -y git gcc gcc-c++ cmake ninja-build python3 python3-pip epel-release
          dnf config-manager --set-enabled crb || true

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Run Build Script (RHEL/Rocky)
        run: |
          chmod +x ./build.sh
          ./build.sh --install-deps --release --clean --version "${{ needs.version.outputs.clean_version }}"

  release:
    name: 5. Publish Release
    needs: [lint, version, sign-macos, sign-windows, build-linux-ubuntu]
    runs-on: ubuntu-latest
    if: >-
      inputs.create_release == true &&
      needs.lint.result == 'success' &&
      needs.version.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create Distribution Directory
        run: mkdir -p _dist

      - name: Download macOS Artifact
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: UTV-${{ needs.version.outputs.version }}-macOS-arm64
          path: _dist

      - name: Download Windows Artifact
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: UTV-${{ needs.version.outputs.version }}-windows-x64
          path: _dist

      - name: Download Linux Artifact
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: UTV-${{ needs.version.outputs.version }}-linux-x64
          path: _dist

      - name: Generate Checksums
        run: |
          cd _dist
          ls -la
          sha256sum UTV-${{ needs.version.outputs.version }}* 2>/dev/null > checksums.sha256 || true
          cat checksums.sha256
        shell: bash

      - name: Generate Auto-Changelog
        id: changelog
        run: |
          chmod +x ./scripts/generate-changelog.sh
          EOF=$(openssl rand -hex 8)
          echo "notes<<$EOF" >> $GITHUB_OUTPUT
          ./scripts/generate-changelog.sh HEAD "${{ needs.version.outputs.version }}" >> $GITHUB_OUTPUT || ./scripts/generate-changelog.sh HEAD >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create and Push Git Tag
        run: |
          git tag -f ${{ needs.version.outputs.version }}
          git push origin ${{ needs.version.outputs.version }} --force
        shell: bash

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ${{ steps.changelog.outputs.notes }}
          EOF

          if gh release view "${{ needs.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Updating existing release..."
            gh release edit "${{ needs.version.outputs.version }}" \
              --title "OpenUTV ${{ needs.version.outputs.version }}" \
              --notes-file release_notes.md \
              --draft=false \
              --latest
          else
            echo "Creating new release..."
            gh release create "${{ needs.version.outputs.version }}" \
              --title "OpenUTV ${{ needs.version.outputs.version }}" \
              --notes-file release_notes.md \
              --draft=false \
              --latest
          fi

          echo "Uploading release assets with checksums..."
          gh release upload "${{ needs.version.outputs.version }}" \
            _dist/* \
            --clobber
        shell: bash
