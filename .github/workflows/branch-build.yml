name: Branch CI (Feature Validation)

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'build.sh'
      - '.github/actions/build-windows/**'
      - '.github/workflows/branch-build.yml'
      - 'requirements.txt'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'build.sh'
      - '.github/actions/build-windows/**'
      - '.github/workflows/branch-build.yml'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to build (leave empty to build current branch ref)'
        required: false
        type: string

permissions:
  contents: read
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: branch-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  check-authorization:
    name: 0. Verify Authorization
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.auth.outputs.authorized }}
      safe_tag: ${{ steps.auth.outputs.safe_tag }}
    steps:
      - name: Evaluate Build Authorization
        id: auth
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          PR_ACTION: ${{ github.event.action }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_ASSOC: ${{ github.event.pull_request.author_association }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 << 'EOF'
          import os, sys, json

          event_name = os.environ.get("EVENT_NAME", "")
          actor = os.environ.get("ACTOR", "")
          is_fork = os.environ.get("IS_FORK", "false").lower() == "true"
          pr_action = os.environ.get("PR_ACTION", "")
          pr_author = os.environ.get("PR_AUTHOR", "")
          pr_assoc = os.environ.get("PR_ASSOC", "")
          pr_number = os.environ.get("PR_NUMBER", "")
          ref_name = os.environ.get("REF_NAME", "")
          labels_raw = os.environ.get("PR_LABELS", "[]")

          try:
              labels = [str(x).lower() for x in json.loads(labels_raw)]
          except Exception:
              labels = []

          APPROVED_USERS = {"sethrosenthal100", "jimhourihan", "mcoliver"}
          APPROVED_ASSOC = {"OWNER", "MEMBER", "COLLABORATOR"}
          APPROVED_LABELS = {"build-binaries", "ok-to-test", "ci:build"}

          authorized = False
          reason = ""

          if event_name == "push" or event_name == "workflow_dispatch":
              authorized = True
              reason = f"Direct {event_name} execution by {actor}"
          elif event_name == "pull_request":
              if not is_fork and pr_action != "labeled":
                  # Internal branch pushes already build via "push" trigger; avoid duplicate matrix runs
                  authorized = False
                  reason = f"Internal branch PR {pr_number}: push to branch already builds binaries"
              else:
                  if pr_author.lower() in APPROVED_USERS:
                      authorized = True
                      reason = f"PR author {pr_author} is in approved contributor list"
                  elif pr_assoc in APPROVED_ASSOC:
                      authorized = True
                      reason = f"PR author association {pr_assoc} is approved"
                  elif any(l in APPROVED_LABELS for l in labels):
                      authorized = True
                      reason = f"PR {pr_number} has approval label: {labels}"
                  else:
                      authorized = False
                      reason = f"PR author {pr_author} is not in approved list and PR has no approval label"

          if pr_number:
              safe_tag = f"pr-{pr_number}"
          else:
              safe_tag = ref_name.replace("/", "-")

          print(f"Build authorization result: authorized={authorized} ({reason})")
          print(f"Safe tag: {safe_tag}")

          github_output = os.environ.get("GITHUB_OUTPUT", "")
          if github_output:
              with open(github_output, "a") as f:
                  auth_val = "true" if authorized else "false"
                  f.write(f"authorized={auth_val}\n")
                  f.write(f"safe_tag={safe_tag}\n")
          EOF

  lint:
    name: 1. Lint Codebase
    needs: [check-authorization]
    if: needs.check-authorization.outputs.authorized == 'true' && github.repository_owner == 'OpenUTV'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  build-macos:
    name: 2a. Build macOS (Ad-Hoc)
    needs: [check-authorization, lint]
    if: needs.check-authorization.outputs.authorized == 'true'
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Check out proprietary vendor SDKs
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: OpenUTV/openutv-vendor-sdks
          token: ${{ secrets.GH_TOKEN_DEPS_READ }}
          path: openutv-vendor-sdks

      - name: Get current date
        id: date
        run: echo "date=$(date +%Y-%W)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Restore Homebrew cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/Library/Caches/Homebrew/downloads
            ~/Library/Caches/Homebrew/Casks
          key: ${{ runner.os }}-brew-${{ steps.date.outputs.date }}-${{ hashFiles('**/build.sh') }}
          restore-keys: |
            ${{ runner.os }}-brew-${{ steps.date.outputs.date }}-
            ${{ runner.os }}-brew-

      - name: Install Homebrew dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "0"
        run: |
          brew update
          brew install --formula \
               ninja readline sqlite3 xz zlib tcl-tk@8 python-tk@3.14 autoconf automake libtool python@3.14 yasm clang-format black meson nasm pkg-config glew ccache doctest qt pyside \
               ffmpeg openexr imath opencolorio libraw libtiff libpng libspng boost openimageio openjpeg webp yaml-cpp spdlog icu4c openjph jpeg-turbo
        shell: bash

      - name: Save Homebrew cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/Library/Caches/Homebrew/downloads
            ~/Library/Caches/Homebrew/Casks
          key: ${{ runner.os }}-brew-${{ steps.date.outputs.date }}-${{ hashFiles('**/build.sh') }}

      - name: Restore CCache
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Build UTV (macOS)
        run: |
          export CCACHE_DIR=~/.ccache
          export SDKROOT=$(xcrun --show-sdk-path)
          chmod +x ./build.sh
          ./build.sh --release --clean
        shell: bash

      - name: Verify macOS minimum version
        run: python3 src/build/check_macos_min_version.py "_build/stage/app/UTV.app"

      - name: Run tests (macOS)
        run: ctest --test-dir _build --output-on-failure --timeout 900

      - name: Save CCache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}

      - name: Package Ad-Hoc Signed App
        run: |
          python3 "${PWD}/src/build/sanitize_homebrew_links.py" "_build/stage/app/UTV.app" || true
          codesign --force --deep --sign - "_build/stage/app/UTV.app"
          mkdir -p _dist
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          SAFE_BRANCH="${{ needs.check-authorization.outputs.safe_tag }}"
          cd _build/stage/app
          ditto -c -k --keepParent UTV.app "${GITHUB_WORKSPACE}/_dist/UTV-${SAFE_BRANCH}-${SHORT_SHA}-macOS-arm64.zip"
        shell: bash

      - name: Upload macOS Branch Artifact
        uses: actions/upload-artifact@v7
        with:
          name: UTV-macOS-arm64
          path: _dist/*.zip
          retention-days: 5

  build-windows:
    name: 2b. Build Windows
    needs: [check-authorization, lint]
    if: needs.check-authorization.outputs.authorized == 'true'
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Check out proprietary vendor SDKs
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: OpenUTV/openutv-vendor-sdks
          token: ${{ secrets.GH_TOKEN_DEPS_READ }}
          path: openutv-vendor-sdks

      - name: Build Windows Executable
        uses: ./.github/actions/build-windows
        with:
          version: 'dev'

      - name: Package Windows Branch Archive
        shell: powershell
        run: |
          $ShortSha = git rev-parse --short=7 HEAD
          $SafeBranch = "${{ needs.check-authorization.outputs.safe_tag }}"
          $ZipName = "UTV-$SafeBranch-$ShortSha-windows-x64.zip"
          New-Item -ItemType Directory -Force -Path "_dist" | Out-Null
          Rename-Item -Path "_install" -NewName "utv-windows-x64"
          Compress-Archive -Path "utv-windows-x64" -DestinationPath "_dist\$ZipName" -CompressionLevel Optimal

      - name: Upload Windows Branch Artifact
        uses: actions/upload-artifact@v7
        with:
          name: UTV-windows-x64
          path: _dist/*.zip
          retention-days: 5

  build-linux:
    name: 2c. Build Linux (Ubuntu)
    needs: [check-authorization, lint]
    if: needs.check-authorization.outputs.authorized == 'true' && github.repository_owner == 'OpenUTV'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Check out proprietary vendor SDKs
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: OpenUTV/openutv-vendor-sdks
          token: ${{ secrets.GH_TOKEN_DEPS_READ }}
          path: openutv-vendor-sdks

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Restore Homebrew cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/Homebrew/downloads
          key: ${{ runner.os }}-brew-${{ steps.date.outputs.date }}-${{ hashFiles('**/build.sh') }}
          restore-keys: |
            ${{ runner.os }}-brew-${{ steps.date.outputs.date }}-
            ${{ runner.os }}-brew-

      - name: Install Homebrew dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "0"
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          sudo apt-get update && sudo apt-get install -y build-essential patchelf mold tcsh libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev libosmesa6-dev libudev-dev libaio-dev libreadline-dev libx11-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxrandr-dev libxrender-dev libxcomposite-dev libxdamage-dev libxtst-dev libxxf86vm-dev libxkbcommon-dev libxkbcommon-x11-dev libffi-dev libasound2-dev libpulse-dev
          brew update
          brew install --formula \
               ninja pkg-config ccache glew doctest python@3.14 qt pyside \
               ffmpeg openexr imath opencolorio libraw libtiff libpng libspng boost \
               openimageio openjpeg webp yaml-cpp spdlog openjph jpeg-turbo
        shell: bash

      - name: Save Homebrew cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/Homebrew/downloads
          key: ${{ runner.os }}-brew-${{ steps.date.outputs.date }}-${{ hashFiles('**/build.sh') }}

      - name: Restore CCache
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Build UTV Linux
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          export CCACHE_DIR=~/.ccache
          chmod +x ./build.sh
          ./build.sh --release --clean
        shell: bash

      - name: Run tests (Linux)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Staged Linux executables are launch wrappers that set up the library path themselves (#66).
          # First with an X display (utvio uses GLX): a virtual X server.
          sudo apt-get install -y --no-install-recommends xvfb > /dev/null
          # ApplicationTest and AudioRendererTest crash in their test bodies; excluded until #78 is fixed.
          xvfb-run -a -s "-screen 0 1920x1080x24" ctest --test-dir _build --output-on-failure --timeout 900 \
            -E 'ApplicationTest|AudioRendererTest'

          # Headless, as on a render node: no X server at all. utvio creates its GL context through EGL.
          env -u DISPLAY UTV_GL_DEBUG=1 _build/stage/app/bin/utvio \
            "solid,red=1,green=0.5,blue=0,width=64,height=64,start=1,end=1.movieproc" -o /tmp/utvio-headless.exr 2>&1 | tail -6
          env -u DISPLAY ctest --test-dir _build --verbose --timeout 900 -R 'cli-smoke|image-format-roundtrip'

      - name: Save CCache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}

      - name: Package Linux Branch Archive
        if: success()
        run: |
          mkdir -p _dist
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          SAFE_BRANCH="${{ needs.check-authorization.outputs.safe_tag }}"
          if [ -d "_build/stage/app" ]; then
            tar -czf "_dist/UTV-${SAFE_BRANCH}-${SHORT_SHA}-linux-x64.tar.gz" -C _build/stage/app .
          fi
        shell: bash

      - name: Upload Linux Branch Artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: UTV-linux-x64
          path: _dist/*.tar.gz
          retention-days: 5

