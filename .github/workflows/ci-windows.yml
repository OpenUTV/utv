name: UTV Windows

on:
  workflow_dispatch:
    inputs:
      attach_to_release:
        description: 'Tag of existing release to attach Windows zip asset to (e.g. 2026.7)'
        required: false
        default: '2026.7'
        type: string
      skip_deps_cache:
        type: string
        default: 'false'
      qt5_modules:
        type: string
        default: ''
      full_matrix:
        type: string
        default: 'true'
      run_debug:
        type: string
        default: 'true'
  workflow_call:
    inputs:
      attach_to_release:
        type: string
        default: ''
      skip_deps_cache:
        type: string
        default: 'false'
      qt5_modules:
        type: string
        default: ''
      full_matrix:
        type: string
        default: 'true'
      run_debug:
        type: string
        default: 'true'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 'Windows Build'
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: ./.github/actions/build-windows
        with:
          version: ${{ inputs.attach_to_release || '2026.7' }}

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: utv-windows-x64
          path: _install/
          retention-days: 7

      - name: Package and Attach to Release
        if: inputs.attach_to_release != ''
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $Ver = "${{ inputs.attach_to_release }}"
          $ZipName = "UTV-$Ver-windows-x64.zip"
          Write-Host "Packaging _install into $ZipName..."
          New-Item -ItemType Directory -Force -Path "_dist" | Out-Null
          Rename-Item -Path "_install" -NewName "utv-windows-x64"
          Compress-Archive -Path "utv-windows-x64" -DestinationPath "_dist\$ZipName" -CompressionLevel Optimal
          Write-Host "Attaching $ZipName to release $Ver..."
          gh release upload $Ver "_dist\$ZipName" --clobber
