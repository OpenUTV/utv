name: Build UTV on Windows
description: Build and test UTV on Windows

inputs:
  build-type:
    required: false
    default: 'Release'
  qt-version:
    required: false
    default: '6.11.0'
  python-version:
    required: false
    default: '3.14'
  cmake-version:
    required: false
    default: '4.3.2'
  vfx-platform:
    required: false
    default: 'CY2026'
  msvc-component:
    required: false
    default: '14.40.17.10.x86.x64'
  msvc-compiler:
    required: false
    default: '14.40.33807'
  qt5_modules:
    required: false
    default: ''
  windows_qt5_archives:
    required: false
    default: 'd3dcompiler_47 opengl32sw qt3d qtactiveqt qtbase qtconnectivity qtdeclarative qtgraphicaleffects qtimageformats qtlocation qtmultimedia qtquickcontrols qtquickcontrols2 qtremoteobjects qtscxml qtsensors qtsvg qttools qttranslations qtwebchannel qtwebsockets qtwebview qtwinextras qtxmlpatterns'
  windows_qt6_modules:
    required: false
    default: 'debug_info qt3d qt5compat qtactiveqt qtcharts qtconnectivity qtdatavis3d qtgrpc qthttpserver qtimageformats qtlanguageserver qtlocation qtlottie qtmultimedia qtnetworkauth qtpdf qtpositioning qtquick3d qtquick3dphysics qtquickeffectmaker qtquicktimeline qtremoteobjects qtscxml qtsensors qtserialbus qtserialport qtshadertools qtspeech qtvirtualkeyboard qtwebchannel qtwebengine qtwebsockets qtwebview'
  windows_qt6_archives:
    required: false
    default: 'd3dcompiler_47 opengl32sw qtbase qtdeclarative qtsvg qttools qttranslations'

runs:
  using: "composite"
  steps:
    - name: Download and Install Prebuilt Dependencies
      shell: powershell
      run: |
        $ReleaseUrl = "https://api.github.com/repos/mcoliver4/utv-dependencies/releases/latest"
        $ReleaseData = Invoke-RestMethod -Uri $ReleaseUrl
        $Asset = $ReleaseData.assets | Where-Object { $_.name -like "*.msi" } | Select-Object -First 1
        if (-not $Asset) {
            Write-Error "Could not find MSI asset in the release."
            exit 1
        }
        $DownloadUrl = $Asset.browser_download_url
        Write-Host "Downloading $DownloadUrl..."
        Invoke-WebRequest -Uri $DownloadUrl -OutFile "OpenUTVDeps.msi"
        Write-Host "Installing MSI..."
        Start-Process msiexec.exe -ArgumentList "/i OpenUTVDeps.msi /qn" -Wait -NoNewWindow
        Write-Host "Installation complete."
        $DepsDir = Get-ChildItem -Path "C:\Program Files\OpenUTVDeps *" | Sort-Object Name -Descending | Select-Object -First 1
        if ($DepsDir) {
            Write-Host "Found OpenUTVDeps at $($DepsDir.FullName)"
            $BinPath = Join-Path $DepsDir.FullName "installed\x64-windows\bin"
            echo "$BinPath" >> $env:GITHUB_PATH
        } else {
            Write-Warning "Could not find OpenUTVDeps installation directory."
        }

    - name: Install MSVC components ${{ inputs.msvc-component }}
      run: |
        Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
        $InstallPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
        $componentsToInstall = @(
          "Microsoft.VisualStudio.Component.VC.${{ inputs.msvc-component }}"
          "Microsoft.VisualStudio.Component.VC.${{ inputs.msvc-component }}.Spectre"
        )
        [string]$workloadArgs = $componentsToInstall | ForEach-Object {" --add " +  $_}
        $Arguments = ('/c', "vs_installer.exe", 'modify', '--installPath', "`"$InstallPath`"", $workloadArgs, '--quiet', '--norestart', '--nocache')
        # should be run twice
        Start-Process -FilePath cmd.exe -ArgumentList $Arguments -Wait -PassThru -WindowStyle Hidden
        Start-Process -FilePath cmd.exe -ArgumentList $Arguments -Wait -PassThru -WindowStyle Hidden
      shell: powershell

    - name: Set up MSVC ${{ inputs.msvc-compiler }}
      uses: ilammy/msvc-dev-cmd@v1
      with:
        toolset: ${{ inputs.msvc-compiler }}
        arch: 'x86_64'

    - name: Setup msys2 and install dependencies
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        # False because it keep creating new cache entry.
        cache: false
        install: >-
          mingw-w64-x86_64-autotools
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-cmake-cmcldeps
          mingw-w64-x86_64-glew
          mingw-w64-x86_64-libarchive
          mingw-w64-x86_64-make
          mingw-w64-x86_64-meson
          mingw-w64-x86_64-toolchain
          autoconf
          automake
          bison
          flex
          git
          libtool
          nasm
          p7zip
          patch
          unzip
          zip

    - name: Activate Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: '${{ inputs.python-version }}'

    - name: Display Python installation location
      run: python -c "import sys; print(sys.executable)"
      shell: powershell

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable

    - name: Cache CMake for Windows
      uses: actions/cache@v5
      id: windows-cmake-cache
      with:
        path: "C:/Program Files/CMake"
        key: ${{ runner.os }}-cmake-${{ inputs.cmake-version }}

    - name: Install CMake ${{ inputs.cmake-version }} with chocolatey
      if: steps.windows-cmake-cache.outputs.cache-hit != 'true'
      run: choco install cmake --version=${{ inputs.cmake-version }} --allow-downgrade
      shell: powershell

    - name: Install JOM (parallel nmake)
      run: choco install jom --yes
      shell: powershell

    - name: Set PATH environment variable
      run: |
        $MsysPythonPath = $env:pythonLocation -replace '\\', '/' -replace 'C:', '/c'
        $ExportCmd = "export PATH=`"/c/Program Files/CMake/bin:$MsysPythonPath:/c/msys64/mingw64/bin:`$PATH:/c/Strawberry/c/bin:/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin:/c/ProgramData/Chocolatey/bin:/c/ProgramData/Chocolatey/lib/jom/tools`""
        $ExportCmd >> C:\msys64\home\runneradmin\.bash_profile
      shell: powershell

    - name: Set ACLOCAL_PATH environment variable
      run: |
        echo "export ACLOCAL_PATH=/c/msys64/usr/share/aclocal" >> ~/.bash_profile
      shell: msys2 {0}

    - name: Add Rust to PATH for msys2
      run: |
        echo "export PATH=\"/c/Users/runneradmin/.cargo/bin:\$PATH\"" >> ~/.bash_profile
      shell: msys2 {0}

    - name: Display environment variables
      run: |
        echo $PATH
        echo $ACLOCAL_PATH
        which python
        python --version
        which cmake
        rustc --version || echo "WARNING: Rust not found in msys2 PATH"
        cargo --version || echo "WARNING: Cargo not found in msys2 PATH"
      shell: msys2 {0}

    - name: Prepare Qt folder
      run: mkdir -p /c/qt
      shell: msys2 {0}

    - name: Install Qt ${{ inputs.qt-version }}
      uses: jurplel/install-qt-action@v4
      with:
        version: '${{ inputs.qt-version }}'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        dir: "c:/"
        install-deps: 'false'
        modules: ${{ inputs.windows_qt6_modules }}
        archives: ${{ inputs.windows_qt6_archives }}
        cache: 'true'
        setup-python: 'false'
        tools: 'tools_qtcreator'
        set-env: 'true'
        tools-only: 'false'
        aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@master'

    - name: Install Python dependencies
      run: python -m pip install --upgrade uv
      shell: powershell

    - name: Setup sccache
      # Used for this run only (SCCACHE_GHA_ENABLED=false); not stored in Actions cache.
      # For sccache to actually cache the Windows/MSVC build, CMake must use it as the compiler
      # launcher, e.g. -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      # in the Configure UTV step (and sccache must be on PATH when the build runs).
      uses: mozilla-actions/sccache-action@v0.0.10
      with:
        version: "v0.15.0"

    - name: Configure sccache for msys2
      run: |
        echo "export PATH=\"/c/Users/runneradmin/.cargo/bin:\$PATH\"" >> ~/.bash_profile
        sccache --version || echo "WARNING: sccache not found in PATH"
      shell: msys2 {0}

    - name: Configure UTV
      run: |
        cmake --version
        cmake -B _build -G "Visual Studio 17 2022" -A x64 -T "version=${{ inputs.msvc-compiler }}" -DRV_DEPS_WIN_PERL_ROOT=c:/Strawberry/perl/bin -DCMAKE_PREFIX_PATH="C:/Qt/${{ inputs.qt-version }}/msvc2022_64;C:/Qt/${{ inputs.qt-version }}/qt6_6110_msvc2022_64" -DCMAKE_BUILD_TYPE=${{ inputs.build-type }}
      shell: msys2 {0}

    - name: Build UTV dependencies
      run: cmake --build _build --config ${{ inputs.build-type }} --target dependencies --parallel=$(python -c 'import os; print(os.cpu_count())') -v
      shell: msys2 {0}
      id: build_deps

    - name: Build UTV main executable
      run: cmake --build _build --config ${{ inputs.build-type }} --target main_executable --parallel=$(python -c 'import os; print(os.cpu_count())') -v
      shell: msys2 {0}

    - name: Tests
      continue-on-error: true
      run: |
        ls -al _build/stage/app/bin
        ctest --test-dir _build -C ${{ inputs.build-type }} --extra-verbose
      shell: msys2 {0}

    - name: Install UTV
      run: cmake --install _build --prefix $(pwd)/_install --config ${{ inputs.build-type }}
      shell: msys2 {0}
