name: Build UTV on Windows
description: Build and test UTV on Windows

inputs:
  version:
    required: false
    default: ''
  build-type:
    required: false
    default: 'Release'
  qt-version:
    required: false
    default: '6.11.2'
  python-version:
    required: false
    default: '3.12'
  cmake-version:
    required: false
    default: '4.3.2'
  vfx-platform:
    required: false
    default: 'CY2026'
  msvc-component:
    required: false
    default: ''
  msvc-compiler:
    required: false
    default: ''
  qt5_modules:
    required: false
    default: ''
  windows_qt5_archives:
    required: false
    default: 'd3dcompiler_47 opengl32sw qt3d qtactiveqt qtbase qtconnectivity qtdeclarative qtgraphicaleffects qtimageformats qtlocation qtmultimedia qtquickcontrols qtquickcontrols2 qtremoteobjects qtscxml qtsensors qtsvg qttools qttranslations qtwebchannel qtwebsockets qtwebview qtwinextras qtxmlpatterns'
  windows_qt6_modules:
    required: false
    default: 'qt5compat qtimageformats qtmultimedia qtpdf qtshadertools'
  windows_qt6_archives:
    required: false
    default: 'd3dcompiler_47 opengl32sw qtbase qtdeclarative qtsvg qttools qttranslations'

runs:
  using: "composite"
  steps:
    - name: Disable Windows Defender Realtime Monitoring for Build Trees
      shell: powershell
      run: |
        Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionPath "${{ github.workspace }}", "C:\.sccache", "C:\Program Files\OpenUTVDeps", "C:\VulkanSDK" -ErrorAction SilentlyContinue

    - name: Download and Install Prebuilt Dependencies
      shell: powershell
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        Write-Host "Downloading OpenUTVDeps MSI via gh release download..."
        try {
            gh release download --repo OpenUTV/utv-dependencies --pattern "*.msi" --clobber
        } catch {
            Write-Warning "gh release download encountered an error, checking fallback releases..."
        }
        $MsiFile = Get-ChildItem -Filter "*.msi" | Select-Object -First 1
        if (-not $MsiFile) {
            Write-Host "Searching recent releases in OpenUTV/utv-dependencies for an MSI package..."
            $releases = gh release list --repo OpenUTV/utv-dependencies | ForEach-Object { ($_ -split "`t")[2] }
            foreach ($rel in $releases) {
                Write-Host "Checking release $rel..."
                try {
                    gh release download $rel --repo OpenUTV/utv-dependencies --pattern "*.msi" --clobber
                    $MsiFile = Get-ChildItem -Filter "*.msi" | Select-Object -First 1
                    if ($MsiFile) {
                        Write-Host "Found MSI package in release $rel"
                        break
                    }
                } catch { }
            }
        }
        if (-not $MsiFile) {
            Write-Error "Could not find or download OpenUTVDeps MSI asset from any release."
            exit 1
        }
        Write-Host "Installing MSI: $($MsiFile.FullName)..."
        # Use Start-Process with /passive for better non-interactive behavior
        $msiProcess = Start-Process msiexec.exe -ArgumentList "/i `"$($MsiFile.FullName)`" /qn /passive" -Wait -PassThru -NoNewWindow
        if ($msiProcess.ExitCode -ne 0 -and $msiProcess.ExitCode -ne 3010) {
            Write-Error "MSI installation failed with exit code $($msiProcess.ExitCode)"
            exit 1
        }
        Write-Host "Installation complete."
        $DepsDir = Get-ChildItem -Path "C:\Program Files\OpenUTVDeps *" | Sort-Object Name -Descending | Select-Object -First 1
        if ($DepsDir) {
            Write-Host "Found OpenUTVDeps at $($DepsDir.FullName)"
            $DepsSlash = $DepsDir.FullName.Replace('\', '/')
            "OPENUTV_DEPS_ROOT=$($DepsDir.FullName)" | Add-Content -Path $env:GITHUB_ENV
            "OPENUTV_DEPS_ROOT_SLASH=$DepsSlash" | Add-Content -Path $env:GITHUB_ENV
            "CMAKE_PREFIX_PATH=$DepsSlash" | Add-Content -Path $env:GITHUB_ENV
            "ZLIB_ROOT=$DepsSlash" | Add-Content -Path $env:GITHUB_ENV
            "PKG_CONFIG_PATH=$DepsSlash/lib/pkgconfig" | Add-Content -Path $env:GITHUB_ENV
            "CMAKE_ARGS=-DCMAKE_PREFIX_PATH=$DepsSlash -DZLIB_ROOT=$DepsSlash" | Add-Content -Path $env:GITHUB_ENV
            "INCLUDE=$($DepsDir.FullName)\include;$env:INCLUDE" | Add-Content -Path $env:GITHUB_ENV
            "LIB=$($DepsDir.FullName)\lib;$env:LIB" | Add-Content -Path $env:GITHUB_ENV
            $BinPath = Join-Path $DepsDir.FullName "bin"
            if (-not (Test-Path $BinPath)) {
                $BinPath = Join-Path $DepsDir.FullName "installed\x64-windows\bin"
            }
            # Add dependencies bin to PATH
            "$BinPath" | Add-Content -Path $env:GITHUB_PATH
        } else {
            Write-Warning "Could not find OpenUTVDeps installation directory."
        }

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: 'x86_64'

    - name: Configure Bundled Python
      shell: powershell
      run: |
        # Look for Bundled Python in the OpenUTVDeps directory
        $DepsDir = Get-ChildItem -Path "C:\Program Files\OpenUTVDeps *" | Sort-Object Name -Descending | Select-Object -First 1
        if ($DepsDir) {
            $PythonPath = Join-Path $DepsDir.FullName "tools\python3"
            if (-not (Test-Path "$PythonPath\python.exe")) {
                $PythonPath = Join-Path $DepsDir.FullName "installed\x64-windows\tools\python3"
            }
            if (-not (Test-Path "$PythonPath\python.exe")) {
                $PythonPath = Join-Path $DepsDir.FullName "bin"
            }
            if (Test-Path "$PythonPath\python.exe") {
                Write-Host "Configuring bundled Python at $PythonPath"
                "pythonLocation=$PythonPath" | Add-Content -Path $env:GITHUB_ENV
                
                # Ensure Python embed package is fetched so python314.zip and standard library modules are always available
                if (-not (Test-Path "$env:TEMP\pyembed\python314.zip")) {
                    Write-Host "Fetching Python 3.14.7 embed standard library..."
                    Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.14.7/python-3.14.7-embed-amd64.zip" -OutFile "$env:TEMP\pyembed.zip"
                    Expand-Archive -Path "$env:TEMP\pyembed.zip" -DestinationPath "$env:TEMP\pyembed" -Force
                }
                $DllsPath = Join-Path $PythonPath "DLLs"
                New-Item -ItemType Directory -Force -Path $DllsPath | Out-Null
                $BinPath = Join-Path $DepsDir.FullName "bin"
                Get-ChildItem -Path "$env:TEMP\pyembed" | Where-Object { ($_.Extension -eq ".pyd" -or $_.Extension -eq ".dll" -or $_.Name -eq "python314.zip") -and $_.Name -notin @("python.exe", "pythonw.exe", "python314.dll") } | ForEach-Object {
                    Copy-Item -Path $_.FullName -Destination $DllsPath -Force
                    Copy-Item -Path $_.FullName -Destination $PythonPath -Force
                    if (Test-Path $BinPath) {
                        Copy-Item -Path $_.FullName -Destination $BinPath -Force
                    }
                }

                # Install standalone uv toolchain
                Write-Host "Installing standalone uv..."
                powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
                "$env:USERPROFILE\.local\bin" | Add-Content -Path $env:GITHUB_PATH
                $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"

                # Bootstrap pip into the bundled Python if missing
                $hasPip = & "$PythonPath\python.exe" -c "import importlib.util; print('OK' if importlib.util.find_spec('pip') else 'MISSING')"
                if ($hasPip -ne "OK") {
                    Write-Host "Bootstrapping pip into bundled Python..."
                    Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "$env:TEMP\get-pip.py"
                    & "$PythonPath\python.exe" "$env:TEMP\get-pip.py" --no-warn-script-location
                }

                # Ensure PySide6 and opencolorio are present in bundled Python
                $hasPySide = & "$PythonPath\python.exe" -c "import importlib.util; print('OK' if importlib.util.find_spec('PySide6') else 'MISSING')" 2>$null
                if ($hasPySide -ne "OK") {
                    Write-Host "Installing PySide6 into bundled Python..."
                    if (Get-Command uv -ErrorAction SilentlyContinue) {
                        uv pip install --python "$PythonPath\python.exe" "PySide6==6.11.2"
                    } else {
                        & "$PythonPath\python.exe" -m pip install "PySide6==6.11.2" --no-warn-script-location
                    }
                }
                $hasOcio = & "$PythonPath\python.exe" -c "import importlib.util; print('OK' if importlib.util.find_spec('PyOpenColorIO') else 'MISSING')" 2>$null
                if ($hasOcio -ne "OK") {
                    Write-Host "Installing opencolorio into bundled Python..."
                    if (Get-Command uv -ErrorAction SilentlyContinue) {
                        uv pip install --python "$PythonPath\python.exe" "opencolorio>=2.5.0"
                    } else {
                        & "$PythonPath\python.exe" -m pip install "opencolorio>=2.5.0" --no-warn-script-location
                    }
                }
            } else {
                Write-Error "Bundled Python not found at $PythonPath"
                exit 1
            }
        } else {
            Write-Error "OpenUTVDeps not found. Cannot configure bundled Python."
            exit 1
        }

    - name: Display Python installation location
      run: |
        Write-Host "Host Python: $(python -c 'import sys; print(sys.executable)')"
        Write-Host "Bundled Python: $env:pythonLocation\python.exe"
      shell: powershell

    - name: Cache CMake for Windows
      uses: actions/cache@v6
      id: windows-cmake-cache
      with:
        path: "C:/Program Files/CMake"
        key: ${{ runner.os }}-cmake-${{ inputs.cmake-version }}

    - name: Install CMake ${{ inputs.cmake-version }} with chocolatey
      if: steps.windows-cmake-cache.outputs.cache-hit != 'true'
      run: choco install cmake --version=${{ inputs.cmake-version }} --allow-downgrade --yes --no-progress
      shell: powershell

    - name: Cache Vulkan SDK for Windows
      uses: actions/cache@v6
      id: windows-vulkan-cache
      with:
        path: "C:/VulkanSDK"
        key: ${{ runner.os }}-vulkan-sdk-1.4.350

    - name: Install build tools (Ninja, flex, bison, nasm, patch, pkg-config, Vulkan)
      run: |
        choco feature enable -n allowEmptyChecksums
        choco install ninja winflexbison3 nasm patch pkgconfiglite --yes --no-progress --allow-empty-checksums --ignore-checksums
        if ("${{ steps.windows-vulkan-cache.outputs.cache-hit }}" -ne "true") {
            choco install vulkan-sdk --yes --no-progress --allow-empty-checksums --ignore-checksums
        }
        "C:\ProgramData\chocolatey\bin" | Add-Content -Path $env:GITHUB_PATH
        $VulkanDir = Get-ChildItem -Path "C:\VulkanSDK" -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
        if ($VulkanDir) {
            Write-Host "Found Vulkan SDK at $($VulkanDir.FullName)"
            $VulkanSlash = $VulkanDir.FullName.Replace('\', '/')
            "VULKAN_SDK=$($VulkanDir.FullName)" | Add-Content -Path $env:GITHUB_ENV
            "Vulkan_ROOT=$VulkanSlash" | Add-Content -Path $env:GITHUB_ENV
            "$($VulkanDir.FullName)\Bin" | Add-Content -Path $env:GITHUB_PATH
        }
      shell: powershell

    - name: Set PATH environment variable
      run: |
        echo "export PATH=\"/c/Program Files/CMake/bin:/c/ProgramData/Chocolatey/bin:/c/ProgramData/Chocolatey/lib/jom/tools:\$PATH\"" >> ~/.bash_profile
      shell: bash

    - name: Display environment variables
      run: |
        echo $PATH
        which python
        python --version
        which cmake
        which pkg-config || echo "pkg-config not found in bash PATH"
      shell: bash

    - name: Prepare Qt folder and 7-Zip
      run: |
        mkdir -p /c/qt
        if [ -d "/c/Program Files/7-Zip" ]; then
          echo "/c/Program Files/7-Zip" >> $GITHUB_PATH
          echo "C:\Program Files\7-Zip" >> $GITHUB_PATH
        fi
      shell: bash

    - name: Install Qt ${{ inputs.qt-version }}
      uses: jurplel/install-qt-action@v4
      with:
        version: '${{ inputs.qt-version }}'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        dir: "c:/"
        install-deps: 'false'
        modules: ${{ inputs.windows_qt6_modules }}
        archives: ${{ inputs.windows_qt6_archives }}
        cache: 'true'
        setup-python: 'true'
        set-env: 'true'
        tools-only: 'false'
        aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@master'

    - name: Activate Bundled Python
      shell: powershell
      run: |
        # Now that Qt is installed, we can move the bundled Python to the front of the PATH
        $PythonPath = $env:pythonLocation
        "$PythonPath" | Add-Content -Path $env:GITHUB_PATH
        "$PythonPath\Scripts" | Add-Content -Path $env:GITHUB_PATH
        Write-Host "Bundled Python is now active on PATH"

    - name: Install Python dependencies
      run: |
        $ReqPath = Join-Path $env:GITHUB_WORKSPACE "requirements.txt"
        if (-not (Test-Path $ReqPath)) {
            $ReqPath = Join-Path $env:GITHUB_WORKSPACE "utv\requirements.txt"
        }
        Write-Host "Installing Python dependencies from $ReqPath"
        if ($env:OPENUTV_DEPS_ROOT) {
            $DepsSlash = $env:OPENUTV_DEPS_ROOT.Replace('\', '/')
            $env:CMAKE_PREFIX_PATH = "$DepsSlash;$env:CMAKE_PREFIX_PATH"
            $env:ZLIB_ROOT = $DepsSlash
            $env:CMAKE_ARGS = "-DCMAKE_PREFIX_PATH=$DepsSlash -DZLIB_ROOT=$DepsSlash"
            $env:INCLUDE = "$env:OPENUTV_DEPS_ROOT\include;$env:INCLUDE"
            $env:LIB = "$env:OPENUTV_DEPS_ROOT\lib;$env:LIB"
        }
        & "$env:pythonLocation\python.exe" -m pip install --upgrade uv
        $uvBin = Join-Path $env:USERPROFILE ".local\bin\uv.exe"
        if (-not (Test-Path $uvBin)) {
            $uvBin = Join-Path $env:pythonLocation "Scripts\uv.exe"
        }
        if (Test-Path $uvBin) {
            & $uvBin pip install --python "$env:pythonLocation\python.exe" --system -r "$ReqPath"
        } else {
            & "$env:pythonLocation\python.exe" -m pip install -r "$ReqPath"
        }
      shell: powershell

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: "v0.15.0"

    - name: Configure sccache directory and cache
      run: |
        if (Test-Path "C:\Users\runneradmin\.cargo\bin") {
            "C:\Users\runneradmin\.cargo\bin" | Add-Content -Path $env:GITHUB_PATH
        }
        "SCCACHE_DIR=C:\.sccache" | Add-Content -Path $env:GITHUB_ENV
        "SCCACHE_CACHE_SIZE=5G" | Add-Content -Path $env:GITHUB_ENV
      shell: powershell

    - name: Restore Sccache
      uses: actions/cache/restore@v6
      with:
        path: "C:/.sccache"
        key: ${{ runner.os }}-sccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-sccache-

    - name: Configure UTV
      run: |
        $PrefixPaths = "C:/Qt/${{ inputs.qt-version }}/msvc2022_64"
        if ($env:OPENUTV_DEPS_ROOT) {
            $PrefixPaths += ";$env:OPENUTV_DEPS_ROOT"
            $DepsSlash = $env:OPENUTV_DEPS_ROOT.Replace('\', '/')
            $env:PKG_CONFIG_PATH = "$DepsSlash/lib/pkgconfig;$env:PKG_CONFIG_PATH"
        }
        $CmakeArgs = @(
            "-B", "_build",
            "-G", "Ninja",
            "-DRV_DEPS_WIN_PERL_ROOT=c:/Strawberry/perl/bin",
            "-DCMAKE_PREFIX_PATH=$PrefixPaths",
            "-DCMAKE_BUILD_TYPE=${{ inputs.build-type }}",
            "-DPython3_ROOT_DIR=$env:pythonLocation",
            "-DCMAKE_C_COMPILER_LAUNCHER=sccache",
            "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
        )
        if ("${{ inputs.version }}" -and "${{ inputs.version }}" -ne "dev") {
            $CleanVer = ("${{ inputs.version }}".Split('-')[0]).Trim()
            $Parts = $CleanVer.Split('.')
            if ($Parts[0] -match '^\d+$') {
                $Major = $Parts[0]
                $Minor = if ($Parts.Length -gt 1) { $Parts[1] } else { "0" }
                $Patch = if ($Parts.Length -gt 2) { $Parts[2] } else { "0" }
                $CmakeArgs += "-DRV_MAJOR_VERSION=$Major"
                $CmakeArgs += "-DRV_MINOR_VERSION=$Minor"
                $CmakeArgs += "-DRV_REVISION_NUMBER=$Patch"
                $CmakeArgs += "-DRV_VERSION_YEAR=$Major"
                $CmakeArgs += "-DRV_VERSION_EXPLICIT=ON"
                Write-Host "Configuring CMake with version $Major.$Minor.$Patch"
            }
        }
        if ($env:VULKAN_SDK) {
            $VulkanSlash = $env:VULKAN_SDK.Replace('\', '/')
            $CmakeArgs += "-DVulkan_ROOT=$VulkanSlash"
        }
        & cmake $CmakeArgs
      shell: powershell

    - name: Build UTV dependencies
      run: cmake --build _build --target dependencies --parallel=$env:NUMBER_OF_PROCESSORS -v
      shell: powershell

    - name: Build UTV main executable
      run: cmake --build _build --target main_executable --parallel=$env:NUMBER_OF_PROCESSORS -v
      shell: powershell

    - name: Tests
      continue-on-error: true
      run: |
        ls -al _build/stage/app/bin
        ctest --test-dir _build --extra-verbose --timeout 60
      shell: bash

    - name: Install UTV
      run: cmake --install _build --prefix $(pwd)/_install
      shell: bash

    - name: Deploy Runtime Support and Scripts
      run: |
        Write-Host "Unbundled dependencies model: OpenUTVDeps provides Qt, Python, FFmpeg, and external codecs."
        if ($env:VCToolsRedistDir) {
            Write-Host "Locating MSVC x64 CRT Redistributable DLLs in $env:VCToolsRedistDir\x64..."
            $CrtDll = Get-ChildItem -Path "$env:VCToolsRedistDir\x64" -Recurse -Filter "msvcp140.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $CrtDll) {
                # Fallback if VCToolsRedistDir structure varies
                $CrtDll = Get-ChildItem -Path "$env:VCToolsRedistDir" -Recurse -Filter "msvcp140.dll" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*x64*" -and $_.FullName -notlike "*arm64*" -and $_.FullName -notlike "*x86*" } | Select-Object -First 1
            }
            if ($CrtDll) {
                $CrtDir = $CrtDll.DirectoryName
                Write-Host "Deploying MSVC x64 CRT Redistributable DLLs from $CrtDir to _install\bin..."
                Copy-Item -Path "$CrtDir\*.dll" -Destination "_install\bin" -Force -ErrorAction SilentlyContinue
            } else {
                Write-Warning "msvcp140.dll for x64 not found under VCToolsRedistDir: $env:VCToolsRedistDir"
            }
        }
        # Ensure scripts\utv exists alongside scripts\rv
        if ((Test-Path "_install\scripts\rv") -and -not (Test-Path "_install\scripts\utv")) {
            Write-Host "Replicating scripts\rv to scripts\utv..."
            Copy-Item -Path "_install\scripts\rv" -Destination "_install\scripts\utv" -Recurse -Force
        }
        # Deploy python3.dll for abi3 extensions and python314.dll
        if ($env:OPENUTV_DEPS_ROOT) {
            $Py3Dll = Join-Path $env:OPENUTV_DEPS_ROOT "tools\python3\python3.dll"
            if (Test-Path $Py3Dll) {
                Copy-Item -Path $Py3Dll -Destination "_install\bin" -Force -ErrorAction SilentlyContinue
            }
            $Py314Dll = Join-Path $env:OPENUTV_DEPS_ROOT "tools\python3\python314.dll"
            if (Test-Path $Py314Dll) {
                Copy-Item -Path $Py314Dll -Destination "_install\bin" -Force -ErrorAction SilentlyContinue
            }
            $SwGl = Join-Path $env:OPENUTV_DEPS_ROOT "tools\python3\Lib\site-packages\PySide6\opengl32sw.dll"
            if (Test-Path $SwGl) {
                Copy-Item -Path $SwGl -Destination "_install\bin" -Force -ErrorAction SilentlyContinue
                Copy-Item -Path $SwGl -Destination "_install\bin\opengl32.dll" -Force -ErrorAction SilentlyContinue
            }
            # Deploy PyOpenColorIO from OpenUTVDeps if present
            $OcioInDeps = Join-Path $env:OPENUTV_DEPS_ROOT "tools\python3\Lib\site-packages\PyOpenColorIO"
            if (Test-Path $OcioInDeps) {
                Write-Host "Deploying PyOpenColorIO from OpenUTVDeps to _install\PlugIns\Python..."
                New-Item -ItemType Directory -Force -Path "_install\PlugIns\Python" | Out-Null
                Copy-Item -Path $OcioInDeps -Destination "_install\PlugIns\Python\PyOpenColorIO" -Recurse -Force -ErrorAction SilentlyContinue
                $OcioDll = Join-Path $OcioInDeps "bin\OpenColorIO_2_5.dll"
                if (Test-Path $OcioDll) {
                    Copy-Item -Path $OcioDll -Destination "_install\bin" -Force -ErrorAction SilentlyContinue
                }
            }
        }
        # Fallback: Deploy PyOpenColorIO from bundled Python site-packages
        if (-not (Test-Path "_install\PlugIns\Python\PyOpenColorIO")) {
            $OcioPkg = Get-ChildItem -Path "C:\Program Files\OpenUTVDeps*", "$env:pythonLocation" -Recurse -Directory -Filter "PyOpenColorIO" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($OcioPkg) {
                Write-Host "Deploying PyOpenColorIO from $($OcioPkg.FullName) to _install\PlugIns\Python..."
                New-Item -ItemType Directory -Force -Path "_install\PlugIns\Python" | Out-Null
                Copy-Item -Path $OcioPkg.FullName -Destination "_install\PlugIns\Python\PyOpenColorIO" -Recurse -Force -ErrorAction SilentlyContinue
                $OcioDll = Join-Path $OcioPkg.FullName "bin\OpenColorIO_2_5.dll"
                if (Test-Path $OcioDll) {
                    Copy-Item -Path $OcioDll -Destination "_install\bin" -Force -ErrorAction SilentlyContinue
                }
            }
        }
        # Deploy helper scripts (diagnostics packager and update checker)
        $HelperSrc = Join-Path $env:GITHUB_WORKSPACE "src\bin\nsapps\UTV"
        if (Test-Path $HelperSrc) {
            Write-Host "Deploying openutv-diagnostics and openutv-check-updates to _install\bin..."
            Copy-Item -Path "$HelperSrc\openutv-diagnostics.*" -Destination "_install\bin" -Force -ErrorAction SilentlyContinue
            Copy-Item -Path "$HelperSrc\openutv-check-updates.*" -Destination "_install\bin" -Force -ErrorAction SilentlyContinue
        }
        if (-not (Test-Path "_install\bin\python3.dll") -and (Get-Command python.exe -ErrorAction SilentlyContinue)) {
            $pyDir = Split-Path (Get-Command python.exe).Source
            if (Test-Path "$pyDir\python3.dll") {
                Copy-Item -Path "$pyDir\python3.dll" -Destination "_install\bin" -Force -ErrorAction SilentlyContinue
            }
        }
      shell: powershell

    - name: Windows Defender Supply Chain Security Scan
      shell: powershell
      run: |
        $installDir = Join-Path $env:GITHUB_WORKSPACE "_install"
        if (Test-Path $installDir) {
            Write-Host "Unexcluding staged application from Defender for security verification..."
            Remove-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue

            $mpCmd = "C:\Program Files\Windows Defender\MpCmdRun.exe"
            if (Test-Path $mpCmd) {
                Write-Host "Scanning staged application with Windows Defender: $installDir"
                & $mpCmd -Scan -ScanType 3 -File "$installDir"
                if ($LASTEXITCODE -eq 2) {
                    Write-Error "Windows Defender detected malware or malicious threat in staged application!"
                    exit 1
                } elseif ($LASTEXITCODE -eq 0) {
                    Write-Host "Windows Defender scan clean. 0 threats detected."
                } else {
                    Write-Warning "Windows Defender scan completed with exit code: $LASTEXITCODE"
                }
            } else {
                Write-Host "Running PowerShell Start-MpScan on $installDir..."
                Start-MpScan -ScanType CustomScan -ScanPath "$installDir"
            }
        } else {
            Write-Warning "Directory _install not found for Defender scan."
        }

    - name: Sccache Statistics
      if: always()
      run: |
        if (Get-Command sccache -ErrorAction SilentlyContinue) {
            sccache --show-stats
        }
      shell: powershell

    - name: Save Sccache
      if: always()
      uses: actions/cache/save@v6
      with:
        path: "C:/.sccache"
        key: ${{ runner.os }}-sccache-${{ github.sha }}


