name: Bug Report
description: Report a problem or unexpected behavior in OpenUTV
title: "fix: <brief description of the issue>"
labels: ["bug"]

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen instead? If possible, include steps to reproduce.
      placeholder: "When opening a directory with image sequences, the app..."
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon)
        - Windows 10 / 11
        - Linux (Ubuntu / Debian)
        - Linux (RHEL / Rocky / Alma)
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or Console Output (Optional)
      description: |
        Paste log output or drag & drop your `UTV.log` file here.
        - **macOS:** `~/Library/Logs/OpenUTV/UTV.log`
        - **Windows:** `%APPDATA%\OpenUTV\Logs\UTV.log`
        - On Windows, you can also run `openutv-diagnostics.bat` from your installation folder.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/OpenUTV/utv/blob/main/.github/CODE_OF_CONDUCT.md)
          required: true